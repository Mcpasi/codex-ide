<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Codex IDE</title>
  <desc id="desc">Codeklammern und Cursor neben der Wortmarke Codex IDE</desc>
  <defs>
    <linearGradient id="ide-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b70"/>
      <stop offset="1" stop-color="#ff8a65"/>
    </linearGradient>
    <filter id="ide-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(18 18)">
    <rect x="18" y="18" width="128" height="128" rx="30" fill="#0c080a" stroke="url(#ide-gradient)" stroke-width="5"/>
    <path d="m72 52-25 30 25 30M108 52l25 30-25 30" fill="none" stroke="url(#ide-gradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#ide-glow)"/>
    <path d="M91 55 79 109" stroke="#fff3f5" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g fill="#fff7f8" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="190" y="96" font-size="62" font-weight="680" letter-spacing="2">CODEX</text>
    <text x="194" y="145" font-size="35" font-weight="750" letter-spacing="15" fill="#ff5b70">IDE</text>
  </g>
</svg>
